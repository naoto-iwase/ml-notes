<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Harness optimization boundary</title>
  <desc id="desc">A fixed target model runs inside an editable harness. Execution evidence is passed to an optimizer that proposes a candidate. An external evaluator measures the candidate, and a separate acceptance rule controls promotion to the registry.</desc>
  <defs>
    <style>
      /* 2.7 KB glyph subset of MathJax New Computer Modern 4.1.3; embedded for SVG image use. GUST Font License. */
      @font-face {
        font-family: "MathJax New Computer Modern";
        src: url("data:font/woff2;base64,") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      .text { font-family: Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .head { font-size: 22px; font-weight: 700; }
      .small { font-size: 15px; }
      .math { font-family: "MathJax New Computer Modern", serif; font-size: 20px; font-weight: 400; }
      .muted { fill: #475569; }
      .blue { fill: #1d4ed8; }
      .rose { fill: #be123c; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="22" fill="#f8fafc"/>

  <text x="42" y="38" class="text head">1  Runtime</text>
  <rect x="30" y="52" width="1140" height="252" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="70" y="138" width="140" height="80" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="140" y="170" text-anchor="middle" class="text head">Task</text>
  <text x="140" y="199" text-anchor="middle" class="text math">𝑥<tspan baseline-shift="sub" font-size="14">𝑡</tspan></text>

  <rect x="280" y="82" width="390" height="190" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="475" y="108" text-anchor="middle" class="text head">Target agent</text>
  <text x="475" y="132" text-anchor="middle" class="text math">𝐴<tspan baseline-shift="sub" font-size="14">𝜃,𝐻<tspan baseline-shift="sub" font-size="10">𝑡</tspan></tspan></text>
  <rect x="310" y="145" width="330" height="110" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="382" y="174" text-anchor="middle" class="text head">Harness</text>
  <text x="382" y="201" text-anchor="middle" class="text math">𝐻<tspan baseline-shift="sub" font-size="14">𝑡</tspan></text>
  <text x="382" y="229" text-anchor="middle" class="text small blue">editable</text>
  <rect x="455" y="162" width="155" height="76" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="532" y="183" text-anchor="middle" class="text head">Model</text>
  <text x="532" y="207" text-anchor="middle" class="text math">𝜃</text>
  <text x="532" y="228" text-anchor="middle" class="text small muted">fixed</text>

  <rect x="740" y="118" width="180" height="120" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="830" y="153" text-anchor="middle" class="text head">Environment</text>
  <text x="830" y="185" text-anchor="middle" class="text math">𝐸</text>
  <text x="830" y="215" text-anchor="middle" class="text small muted">fixed · tools/state</text>

  <rect x="990" y="138" width="150" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1065" y="170" text-anchor="middle" class="text head">Evidence</text>
  <text x="1065" y="199" text-anchor="middle" class="text math">(𝜏<tspan baseline-shift="sub" font-size="14">𝑡</tspan>, 𝑦<tspan baseline-shift="sub" font-size="14">𝑡</tspan>)</text>

  <path d="M210 178 H270" class="line"/><polygon points="280,178 270,172 270,184" fill="#475569"/>
  <path d="M670 178 H730" class="line"/><polygon points="740,178 730,172 730,184" fill="#475569"/>
  <path d="M920 178 H980" class="line"/><polygon points="990,178 980,172 980,184" fill="#475569"/>

  <text x="42" y="350" class="text head">2  Persistent update</text>
  <rect x="30" y="366" width="1140" height="220" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="70" y="428" width="210" height="96" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="175" y="456" text-anchor="middle" class="text head">Optimizer</text>
  <text x="175" y="482" text-anchor="middle" class="text math">𝑂</text>
  <text x="175" y="510" text-anchor="middle" class="text small muted">propose only</text>

  <rect x="350" y="428" width="180" height="96" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="463" text-anchor="middle" class="text head">Candidate</text>
  <text x="440" y="495" text-anchor="middle" class="text math">𝐻′<tspan baseline-shift="sub" font-size="14">𝑡</tspan></text>

  <rect x="580" y="398" width="570" height="156" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="604" y="418" class="text small rose">outside optimizer write scope</text>

  <rect x="605" y="428" width="150" height="96" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="680" y="463" text-anchor="middle" class="text head">Evaluator</text>
  <text x="680" y="495" text-anchor="middle" class="text small muted">measure</text>

  <rect x="790" y="428" width="155" height="96" rx="13" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="867" y="456" text-anchor="middle" class="text head">Rule</text>
  <text x="867" y="482" text-anchor="middle" class="text math">𝑉</text>
  <text x="867" y="510" text-anchor="middle" class="text small muted">accept / reject</text>

  <rect x="980" y="428" width="145" height="96" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1052" y="463" text-anchor="middle" class="text head">Registry</text>
  <text x="1052" y="495" text-anchor="middle" class="text math">𝐻<tspan baseline-shift="sub" font-size="14">𝑡+1</tspan></text>

  <path d="M280 476 H340" class="line-blue"/><polygon points="350,476 339,469 339,483" fill="#2563eb"/>
  <path d="M530 476 H595" class="line"/><polygon points="605,476 595,470 595,482" fill="#475569"/>
  <path d="M755 476 H780" class="line"/><polygon points="790,476 780,470 780,482" fill="#475569"/>
  <path d="M945 476 H970" class="line"/><polygon points="980,476 970,470 970,482" fill="#475569"/>
</svg>