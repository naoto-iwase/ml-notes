<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">From failure trajectory to validated harness update</title>
  <desc id="desc">Three panels show first-divergence localization, a bounded pre-action hook patch, and independent validation across targeted, regression, sealed, and permission checks.</desc>
  <defs>
    <style>
      .text { font-family: Arial, "Helvetica Neue", sans-serif; fill: #0f172a; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .mono { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; }
      .muted { fill: #475569; }
      .red { fill: #dc2626; }
      .green { fill: #047857; }
      .white { fill: #f8fafc; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1320" height="650" rx="22" fill="#f8fafc"/>

  <!-- Panel 1: trajectory -->
  <rect x="28" y="28" width="392" height="594" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="50" y="50" width="34" height="34" rx="9" fill="#475569"/>
  <text x="67" y="74" text-anchor="middle" class="text head white">1</text>
  <text x="98" y="75" class="text head">Failure trajectory</text>
  <text x="52" y="106" class="text small muted">Find the earliest divergence</text>

  <path d="M86 154 V466" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="86" cy="158" r="14" fill="#64748b"/>
  <text x="120" y="164" class="text body" font-weight="700">1  Observe task</text>
  <text x="120" y="188" class="text small muted">expected state</text>

  <circle cx="86" cy="234" r="14" fill="#64748b"/>
  <text x="120" y="240" class="text body" font-weight="700">2  Select tool</text>
  <text x="120" y="264" class="text small muted">correct tool family</text>

  <circle cx="86" cy="310" r="20" fill="#ef4444"/>
  <circle cx="86" cy="310" r="29" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="120" y="305" class="text body" font-weight="700">3  Invalid action</text>
  <text x="120" y="329" class="text small red">first divergence</text>
  <text x="120" y="351" class="text small muted">required field not validated</text>

  <circle cx="86" cy="394" r="14" fill="#fca5a5"/>
  <text x="120" y="400" class="text body" font-weight="700">4  Tool error</text>
  <text x="120" y="424" class="text small muted">downstream symptom</text>

  <circle cx="86" cy="466" r="14" fill="#fca5a5"/>
  <text x="120" y="472" class="text body" font-weight="700">5  Retry loop</text>
  <text x="120" y="496" class="text small muted">downstream symptom</text>

  <rect x="52" y="530" width="344" height="68" rx="13" fill="#fff1f2" stroke="#fda4af"/>
  <text x="224" y="558" text-anchor="middle" class="text body" font-weight="700">Localize step 3</text>
  <text x="224" y="582" text-anchor="middle" class="text small muted">ignore downstream symptoms</text>

  <!-- Panel 2: patch -->
  <rect x="464" y="28" width="392" height="594" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="486" y="50" width="34" height="34" rx="9" fill="#7c3aed"/>
  <text x="503" y="74" text-anchor="middle" class="text head white">2</text>
  <text x="534" y="75" class="text head">Bounded patch</text>
  <text x="488" y="106" class="text small muted">Map one failure mode to one edit surface</text>

  <text x="494" y="144" class="text small muted">FAILURE SIGNATURE</text>
  <rect x="494" y="158" width="332" height="76" rx="13" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="660" y="187" text-anchor="middle" class="text body" font-weight="700">missing precondition check</text>
  <text x="660" y="214" text-anchor="middle" class="text small muted">schema validation before tool call</text>

  <text x="494" y="270" class="text small muted">EDIT SURFACE</text>
  <rect x="494" y="284" width="332" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="320" text-anchor="middle" class="text head mono">pre-action hook</text>

  <text x="494" y="378" class="text small muted">PATCH</text>
  <rect x="494" y="392" width="332" height="116" rx="12" fill="#0f172a"/>
  <text x="516" y="422" class="text small mono white">+ validate_required_fields(action)</text>
  <text x="516" y="450" class="text small mono white">+ if invalid: request_repair()</text>
  <text x="516" y="478" class="text small mono white">  tool_call(action)</text>

  <text x="494" y="548" class="text small muted">INVARIANTS</text>
  <text x="510" y="576" class="text body">Schema unchanged</text>
  <text x="808" y="576" text-anchor="end" class="text body green" font-weight="700">PASS ✓</text>
  <text x="510" y="602" class="text body">Permission unchanged</text>
  <text x="808" y="602" text-anchor="end" class="text body green" font-weight="700">PASS ✓</text>

  <!-- Panel 3: validation -->
  <rect x="900" y="28" width="392" height="594" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="922" y="50" width="34" height="34" rx="9" fill="#059669"/>
  <text x="939" y="74" text-anchor="middle" class="text head white">3</text>
  <text x="970" y="75" class="text head">External validation</text>
  <text x="924" y="106" class="text small muted">Test the fix and spillover independently</text>

  <rect x="930" y="138" width="332" height="50" fill="#e2e8f0"/>
  <text x="950" y="170" class="text body" font-weight="700">Check</text>
  <text x="1180" y="170" text-anchor="middle" class="text body" font-weight="700">Result</text>
  <line x1="1095" y1="138" x2="1095" y2="438" stroke="#cbd5e1"/>

  <rect x="930" y="188" width="332" height="62" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="950" y="225" class="text body">Targeted failure</text>
  <text x="1180" y="225" text-anchor="middle" class="text body green" font-weight="700">FIXED ✓</text>

  <rect x="930" y="250" width="332" height="62" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="950" y="287" class="text body">Incumbent successes</text>
  <text x="1180" y="287" text-anchor="middle" class="text body green" font-weight="700">PASS ✓</text>

  <rect x="930" y="312" width="332" height="62" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="950" y="349" class="text body">Sealed tasks</text>
  <text x="1180" y="349" text-anchor="middle" class="text body green" font-weight="700">IMPROVES ✓</text>

  <rect x="930" y="374" width="332" height="64" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="950" y="412" class="text body">Permission surface</text>
  <text x="1180" y="412" text-anchor="middle" class="text body green" font-weight="700">UNCHANGED ✓</text>

  <rect x="930" y="492" width="332" height="92" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1096" y="530" text-anchor="middle" class="text head">PROMOTE</text>
  <text x="1096" y="558" text-anchor="middle" class="text small muted">candidate becomes new incumbent</text>

  <!-- Flow between panels -->
  <path d="M420 326 H454" class="line"/><polygon points="464,326 454,320 454,332" fill="#475569"/>
  <path d="M856 326 H890" class="line"/><polygon points="900,326 890,320 890,332" fill="#475569"/>
</svg>